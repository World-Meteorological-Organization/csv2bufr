name: tests ⚙️

on: [ push, pull_request ]

jobs:
  main:
    runs-on: ubuntu-latest
    container:
      image: wmoim/dim_eccodes_baseimage:noble_eccodes-2.44

    steps:
    - uses: actions/checkout@v4

    - name: Install requirements 📦
      run: |
        apt get update
        apt get install -y wget
        pip3 install --upgrade pip
        pip3 install -r requirements.txt
        pip3 install -r requirements-dev.txt
        pip3 install .
        mkdir -p /opt/csv2bufr
        cd /opt/csv2bufr
        wget https://github.com/wmo-im/csv2bufr-templates/archive/refs/tags/v0.5.tar.gz
        tar -zxf v0.5.tar.gz --strip-components=1 csv2bufr-templates-0.5/templates
    - name: run tests ⚙️
      run: |
        pytest
    - name: run flake8 ⚙️
      run: |
        flake8
